function intro(help){modal(b=>{b.innerHTML=`<h3>🕰️ Volver a 1998</h3><p>Noviembre de 2026. Cerrás los ojos y abrís: marzo de 1998, Montevideo, 17 años y toda tu memoria del futuro.</p><p class=s>• Tocá un lugar del mapa para caminar y actuar. Cada acción gasta ⏳ (3 por mes; un trabajo te saca 1). <b>Pasar mes</b> avanza el tiempo.<br>• Siendo menor ahorrás con changas y con papá/mamá en el banco; a los 18 podés trabajar, jugar, apostar e invertir.<br>• <b>Inmobiliaria</b>: comprá casas para vivir o alquilar, y negocios, a tu nombre o al de otro. <b>Tienda</b>: autos, motos, compus, celulares. Lo que mostrás sube tu <b>atención</b> 🕵️: envidia, pedidos, robos, impuestos. Elegí tu perfil (discreto/ostentoso) en el 📱.<br>• <b>Apuestas</b> a las finales deportivas, <b>viajes</b> con quien quieras, amigos y novias, y redes sociales cuando aparezcan.<br>• El 📱 tiene las <b>alarmas</b> (1-2 meses antes de lo importante) y las redes.<br>• Podés contar tu secreto o callarlo, y saltar años (perdés esos años de acción).<br>• En noviembre de 2026 se compara tu vida con la original.<br>• Precios y sorteos son estilizados/ficticios; cargá los reales en 🎟.</p>`;
if(!help){b.insertAdjacentHTML('beforeend','<p><b>Dificultad</b> <span class=s>(fácil: más plata y memoria perfecta; difícil: menos plata, memoria borrosa y más riesgos)</span></p>');[['Fácil',0],['Normal',1],['Difícil',2]].forEach(([t,d])=>bt(b,'Empezar '+t,()=>{nuevo(d);$('#md').hidden=true;ren()}));bt(b,'✏️ Nombres',openNames)}})}

cx.fillStyle='#8a8f98';[77,152,227].forEach(y=>cx.fillRect(0,y,360,12));[117,242].forEach(x=>cx.fillRect(x,0,12,330));

const x=ply[0],y=ply[1],bb=tgt?Math.sin(wk*3)*2:0;cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x,y,7,3,0,0,7);cx.fill();cx.fillStyle='#2d3a8c';cx.fillRect(x-4,y-8,3,8-Math.max(0,bb));cx.fillRect(x+1,y-8,3,8+Math.min(0,bb));cx.fillStyle='#f2a93b';cx.fillRect(x-5,y-18,10,11);cx.fillStyle='#f2c9a0';cx.beginPath();cx.arc(x,y-23,5,0,7);cx.fill();cx.fillStyle='#3b2a1a';cx.fillRect(x-5,y-29,10,4);
requestAnimationFrame(loop)};
