function openTell(ks){modal(b=>{b.innerHTML=`<h3>🗣️ Contar el secreto</h3><p class=s>Cada persona reacciona distinto. ${S.proof?'Tus predicciones cumplidas ayudan.':'Si primero anotás predicciones y se cumplen, te creen más.'} Quien te cree puede ayudarte (por ejemplo, jugar tus números siendo vos menor) y te alivia el estrés; quien no, puede asustarse o contarlo.</p>`;
ks.forEach(k=>{if(!S.dead[k]&&!S.told[k])bt(b,`${N(k)} · ${TR[k][1]} · relación ${F(S.rel[k])}`,()=>{$('#md').hidden=true;tell(k)})})})}
function tell(k){if(S.told[k]||!use())return;const t=TR[k];S.told[k]=1;S.bf++;const p=t[0]+S.rel[k]*.35+(S.proof?25:0)-10,r=R()*100;let m;
if(r<p){S.bel[k]=1;S.rel[k]+=12;S.mood+=8;m=`${N(k)} te cree (${t[1]}). Ya no cargás solo con el secreto.`}
else if(r<p+25){S.rel[k]-=5;S.mood-=6;m=`${N(k)} duda: piensa que es estrés o una broma.`}
else if(k=='am'||k=='es'){S.rel[k]-=15;S.mood-=8;m=`${N(k)} se enoja: cree que le tomás el pelo.`}
else{S.pen=1;S.rep-=10;S.mood-=8;m=`${N(k)} se asusta y te lleva a un psicólogo. Perdés tiempo y credibilidad.`}
if((k=='h2'||k=='am')&&R()<.35){S.rep-=15;S.susp+=25;m+=' Y lo cuenta por ahí: el rumor se esparce.'}
L(m);toast(m);cl();ren()}
function mes(sk){S.t++;const y=yr(S.t),m=mo(S.t),a=age(S.t),f=fx();S.ap=Math.max(1,3-(S.job>=0&&a>=18?1:0)-S.pen);S.pen=0;
if(S.job>=0&&a>=18){const j=J[S.job];S.exp++;S.pe+=j.s[S.lvl]*f;S.st+=2;const e=S.exp+S.sk*.8;let n=0;[0,10,30,60].forEach((t,i)=>{if(e>=t*j.h)n=i});if(n>S.lvl){S.lvl=n;L(`🎉 Ascenso: ${j.l[n]} (US$${j.s[n]}/mes)`);S.mood+=10}}
if(a<18)S.pe+=500;
if(a>=18){const g=140+(S.sp==2?100:0)+(S.kb>=0&&S.t>=S.kb?90:0);if(!pay(g)){S.mood-=8;S.st+=8;L('💸 No te alcanza la plata este mes.')}}
S.bk*=1.0025;for(const k in S.rel){if(k=='es'&&S.sp==0)continue;S.rel[k]-=sk?1:.4}
['pa','ma'].forEach(k=>{if(S.dead[k])return;S.par[k]-=R()*.4+(sk?.1:0);if(S.par[k]<=0){S.dead[k]=1;S.rel[k]=0;S.mood-=30;S.bf+=5;L('🕊️ '+N(k)+' falleció. En tu 2026 original estaba vivo/a.')}else if(S.par[k]<35&&R()<.15)L('⚠️ '+N(k)+' tuvo un susto de salud. Llevalo/a al médico.')});
S.hp-=.1+S.st/400;S.st-=2+Object.keys(S.bel).length*.5;if(S.st>80){S.hp-=2;S.mood-=2}S.mood+=(60-S.mood)*.06;S.susp=Math.max(0,S.susp-.5);if(S.hp<=0)S.end=2;
if(S.sp==1&&S.rel.es<15){S.sp=0;L('💔 Con '+N('es')+' se enfrió todo.')}
if(S.sp==2&&S.rel.es<20){S.sp=3;S.bf+=3;S.mood-=25;L('💔 Tu matrimonio se rompe.')}
if(S.t==S.kb){L('👶 Nace tu hijo/a '+N('hj')+'.');S.mood+=20;S.rel.hj=60}
NB.forEach(n=>{if(n[0]==y&&n[1]==m){if(R()<Math.max(.4,1-S.bf*.03)){S.nie++;S.mood+=6;L('🍼 Nace '+n[3]+' de '+N(n[2])+'.')}else L('🦋 '+N(n[2])+' no tiene el bebé que tenía en tu 2026 original.')}});
E.forEach(e=>{if(e[0]==y&&e[1]==m){L(e[2]);if(e[4])e[4]();if(e[3]&&S.pred>=0&&S.pred<S.t&&!S.proof){S.proof=1;L('🔮 Tus predicciones anotadas se están cumpliendo. Ahora te creerían más.')}}});
S.lib.forEach(d=>{if(!d.res&&d.y==y&&d.m==m){d.res=1;if(d.b){S.pe+=d.p;S.bf+=3;S.susp+=(S.bel.pa||S.bel.ma)?10:30;S.mood+=15;L(`🎉 ¡GANASTE! ${d.k=='5'?'5 de Oro':'Quiniela'} (${d.n}): $${fm(d.p)}`)}else L('🎟️ Salió '+(d.k=='5'?'el 5 de Oro':'la Quiniela')+' y no jugaste ('+d.n+').')}});
if(S.susp>=100){S.susp=40;S.rep-=25;S.pen=1;L('🕵️ Alguien sospecha de tu suerte: te investigan. Perdés tiempo y reputación.')}
if(S.t>=END&&!S.end)S.end=1;cl();save()}
function after(){ren();if(S.end)fin()}
function openSkip(){modal(b=>{b.innerHTML='<h3>⏩ Saltar el tiempo</h3><p class=s>Podés dejar pasar meses o años sin actuar. Tu trabajo y tus inversiones siguen y el efectivo en pesos se pasa solo a dólares, pero <b>perdés esos años</b> de decisiones: la familia se enfría y la vida sigue sin vos. Los eventos del mundo ocurren igual. Decidís vos.</p>';
[['6 meses',6],['1 año',12],['3 años',36],['5 años',60],['10 años',120],['Hasta 2026',999]].forEach(([t,n])=>bt(b,t,()=>{$('#md').hidden=true;for(let i=0;i<n&&!S.end;i++){mes(1);const x=S.pe-3000;if(x>0){S.us+=x/fx();S.pe-=x}}S.bf+=F(Math.min(n,200)/12);L('⏩ Dejaste pasar el tiempo.');after()}))})}
function openDiary(){modal(b=>{b.innerHTML='<h3>📓 Diario</h3>'+(S.log.slice().reverse().map(x=>'<div class=row>'+x+'</div>').join('')||'<p class=s>Todavía no pasó nada.</p>')})}
function openLib(){modal(b=>{b.innerHTML='<h3>🎟 Libreta de números</h3><p class=s>Los sorteos de fábrica son <b>ficticios</b>. Reemplazalos o agregá los resultados reales de la Quiniela y el 5 de Oro de Uruguay que recuerdes o tengas anotados.</p>';
S.lib.map((d,i)=>[d,i]).sort((a,c)=>a[0].y*12+a[0].m-c[0].y*12-c[0].m).forEach(([d,i])=>{const r=document.createElement('div');r.className='row';r.append(`${d.k=='5'?'🍀 5 de Oro':'🎲 Quiniela'} ${ds(d.y,d.m)} · ${d.n} · $${fm(d.p)}${d.f?' (ficticio)':''}${d.b?' ✅':''} `);bt(r,'🗑',()=>{S.lib.splice(i,1);save();openLib()});b.appendChild(r)});
const f=document.createElement('div');f.innerHTML='<h3 style="margin-top:12px">Agregar sorteo</h3><label>Juego<select id=lk><option value=5>5 de Oro</option><option value=Q>Quiniela</option></select></label><label>Mes<select id=lm>'+MN.map((x,i)=>`<option value=${i}>${x}</option>`).join('')+'</select></label><label>Año<input id=ly type=number value=1999></label><label>Números<input id=ln></label><label>Premio ($)<input id=lp type=number></label><label>Costo del boleto ($)<input id=lc type=number value=30></label>';
b.appendChild(f);bt(b,'Agregar',()=>{const d={k:$('#lk').value,m:+$('#lm').value,y:+$('#ly').value,n:$('#ln').value||'—',p:+$('#lp').value||0,c:+$('#lc').value||30};if(d.y<1998||d.y>2026)return toast('Año entre 1998 y 2026');S.lib.push(d);save();openLib()})})}
function openNames(){modal(b=>{b.innerHTML='<h3>Nombres</h3>';const lab={pa:'Papá',ma:'Mamá',h1:'Hermana mayor',h2:'Otra hermana',am:'Mejor amigo',es:'Tu futura esposa',hj:'Tu hijo'};for(const k in lab){const l=document.createElement('label'),i=document.createElement('input');i.value=S.names[k];i.oninput=()=>{S.names[k]=i.value||lab[k];save()};l.append(lab[k],i);b.appendChild(l)}})}
function openMenu(){modal(b=>{b.innerHTML='<h3>⚙ Menú</h3>';bt(b,'✏️ Cambiar nombres',openNames);bt(b,'❓ Cómo se juega',intro);bt(b,'🔄 Nueva partida',()=>{if(confirm('¿Empezar de cero? Se pierde esta partida.')){nuevo();$('#md').hidden=true;ren();intro()}})})}
function intro(){modal(b=>{b.innerHTML=`<h3>🕰️ Volver a 1998</h3><p>Es noviembre de 2026. Cerrás los ojos y abrís: marzo de 1998, Montevideo, tenés 17 años y toda tu memoria del futuro.</p><p class=s>• Tocá un lugar del mapa para caminar hasta ahí y actuar. Cada acción gasta ⏳ (3 por mes; un trabajo te saca 1).<br>• <b>Pasar mes</b> avanza el tiempo: cobrás, pagan los sorteos, ocurren hechos reales y tus cambios se propagan (🦋).<br>• Siendo menor ahorrás con changas y con papá/mamá en el banco; a los 18 podés trabajar, jugar y invertir.<br>• Podés <b>contar tu secreto</b> o callarlo, y <b>saltar años</b> si querés (perdés esos años de acción).<br>• Llegás hasta noviembre de 2026 y se compara con tu 2026 original: casado, un hijo de 7, director en un canal de TV, papás vivos y 3 sobrinos.<br>• Precios y sorteos son estilizados/ficticios; cargá los reales en 🎟.</p>`;bt(b,'✏️ Personalizar nombres',openNames)})}
function fin(){const a=age(S.t),j=S.job>=0?J[S.job]:null,w=wealth(),kid=S.kb>=0&&S.t>=S.kb?`${N('hj')}, ${F((S.t-S.kb)/12)} años`:'Sin hijos',pad=['pa','ma'].map(k=>`${N(k)}: ${S.dead[k]?'ya no está':'vivo/a'}`).join(' · ');
const bel=Object.keys(S.bel).map(N).join(', ')||'nadie';
const sc=Math.round((S.sp==2?10:0)+(S.kb>=0&&S.t>=S.kb?10:0)+(!S.dead.pa?5:0)+(!S.dead.ma?5:0)+S.hp/5+C(Math.log10(w+1)/6*25,0,25)+(j?(S.lvl+1)*6:0)+S.nie*3);
modal(b=>{b.innerHTML=`<h3>${S.end==2?'💔 Tu salud no aguantó':'🌆 Noviembre de 2026'}</h3><p class=s>Tu vida nueva comparada con la original (🦋 ${S.bf} cambios grandes).</p><table><tr><th></th><th>Antes</th><th>Ahora</th></tr>
<tr><td>Trabajo</td><td>Director en un canal de TV</td><td>${j?j.l[S.lvl]+' ('+j.n+')':'Sin trabajo fijo'}</td></tr>
<tr><td>Pareja</td><td>Casado</td><td>${S.sp==2?'Casado con '+N('es'):S.sp==3?'Separado':S.sp==1?'En pareja con '+N('es'):'Soltero'}</td></tr>
<tr><td>Hijos</td><td>Un hijo de 7</td><td>${kid}</td></tr><tr><td>Padres</td><td>Ambos vivos</td><td>${pad}</td></tr>
<tr><td>Sobrinos</td><td>3</td><td>${S.nie}</td></tr><tr><td>Patrimonio</td><td>Normal</td><td>US$${fm(w)}</td></tr>
<tr><td>Salud / ánimo</td><td>—</td><td>${F(S.hp)} / ${F(S.mood)}</td></tr><tr><td>Te creyeron</td><td>—</td><td>${bel}</td></tr></table><h3 style="margin-top:10px">Puntaje: ${sc}/100</h3><p>${sc>=75?'Aprovechaste la segunda oportunidad sin perder lo que importa.':sc>=50?'Una vida distinta, con luces y sombras.':'Cambiaste el futuro, pero no necesariamente para mejor.'}</p>`;bt(b,'🔄 Jugar de nuevo',()=>{nuevo();$('#md').hidden=true;ren();intro()})})}
$('#bm').onclick=()=>{if(S.end)return fin();mes(0);after()};$('#bs').onclick=openSkip;$('#bd').onclick=openDiary;$('#bl').onclick=openLib;$('#bn').onclick=openMenu;
const cv=$('#cv'),cx=cv.getContext('2d');
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*210/r.height;let b=null,bd=1e9;for(const k in PL){const d=Math.hypot(PL[k][0]-x,PL[k][1]-y);if(d<bd){bd=d;b=k}}if(bd<50&&b!=S.pos){S.pos=b;tgt=b;panel()}};
function loop(){cx.fillStyle='#2f6b4f';cx.fillRect(0,0,360,210);cx.fillStyle='#3a7a5b';for(let i=0;i<360;i+=20)for(let j=0;j<210;j+=20)if((i+j)%40==0)cx.fillRect(i,j,20,20);
cx.fillStyle='#8a8f98';cx.fillRect(0,100,360,14);cx.fillRect(100,0,12,210);cx.fillRect(205,0,12,210);
for(const k in PL){const[x,y,e,n,c]=PL[k];cx.fillStyle=c;cx.fillRect(x-26,y-18,52,36);cx.fillStyle='rgba(0,0,0,.28)';cx.fillRect(x-26,y-18,52,8);cx.font='20px serif';cx.textAlign='center';cx.fillText(e,x,y+10);cx.font='bold 10px Verdana';cx.fillStyle='#fff';cx.fillText(n,x,y+30)}
if(tgt){const T=PL[tgt],dx=T[0]-ply[0],dy=T[1]+30-ply[1],d=Math.hypot(dx,dy);if(d<3){tgt=null;panel()}else{ply[0]+=dx/d*2.6;ply[1]+=dy/d*2.6;wk+=.4}}
const x=ply[0],y=ply[1],bb=tgt?Math.sin(wk*3)*2:0;cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x,y,7,3,0,0,7);cx.fill();cx.fillStyle='#2d3a8c';cx.fillRect(x-4,y-8,3,8-Math.max(0,bb));cx.fillRect(x+1,y-8,3,8+Math.min(0,bb));cx.fillStyle='#f2a93b';cx.fillRect(x-5,y-18,10,11);cx.fillStyle='#f2c9a0';cx.beginPath();cx.arc(x,y-23,5,0,7);cx.fill();cx.fillStyle='#3b2a1a';cx.fillRect(x-5,y-29,10,4);
requestAnimationFrame(loop)}
(function(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(s&&s.t!=null&&!s.end){S=s;ply=[PL[S.pos][0],PL[S.pos][1]+30];ren();toast('Partida cargada')}else{nuevo();ren();intro()}
loop();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
